[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "folio-translator"
version = "0.1.0"
description = "A local-first multilingual PDF translation and review workbench"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "jinja2>=3.1,<4",
  "pymupdf>=1.25,<2",
  "pypdf>=5,<7",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "redis>=5,<7",
  "rq>=2,<3",
  "rapidfuzz>=3.9,<4",
  "lingua-language-detector>=2.0,<3",
  "pillow>=11,<13",
  "opencv-python-headless>=4.10,<5",
  "fonttools>=4.55,<5",
]

[project.optional-dependencies]
dev = [
  "editables>=0.5,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
